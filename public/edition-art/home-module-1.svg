<svg viewBox="0 0 260 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Input layer -->
              <circle cx="40" cy="25" r="8" stroke="#6c5ce7" stroke-width="1.5" fill="rgba(108,92,231,0.06)"/>
              <circle cx="40" cy="60" r="8" stroke="#6c5ce7" stroke-width="1.5" fill="rgba(108,92,231,0.06)"/>
              <circle cx="40" cy="95" r="8" stroke="#6c5ce7" stroke-width="1.5" fill="rgba(108,92,231,0.06)"/>
              <!-- Hidden layer -->
              <circle cx="130" cy="35" r="10" stroke="#6c5ce7" stroke-width="1.8" fill="rgba(108,92,231,0.10)"/>
              <circle cx="130" cy="85" r="10" stroke="#6c5ce7" stroke-width="1.8" fill="rgba(108,92,231,0.10)"/>
              <!-- Output -->
              <circle cx="220" cy="60" r="12" stroke="#6c5ce7" stroke-width="2" fill="rgba(108,92,231,0.14)"/>
              <!-- Connections input→hidden -->
              <line x1="48" y1="25" x2="120" y2="35" stroke="#a29bfe" stroke-width="1" opacity="0.5"/>
              <line x1="48" y1="25" x2="120" y2="85" stroke="#a29bfe" stroke-width="1" opacity="0.3"/>
              <line x1="48" y1="60" x2="120" y2="35" stroke="#a29bfe" stroke-width="1" opacity="0.4"/>
              <line x1="48" y1="60" x2="120" y2="85" stroke="#a29bfe" stroke-width="1" opacity="0.5"/>
              <line x1="48" y1="95" x2="120" y2="35" stroke="#a29bfe" stroke-width="1" opacity="0.3"/>
              <line x1="48" y1="95" x2="120" y2="85" stroke="#a29bfe" stroke-width="1" opacity="0.4"/>
              <!-- Connections hidden→output -->
              <line x1="140" y1="35" x2="208" y2="60" stroke="#6c5ce7" stroke-width="1.2" opacity="0.5"/>
              <line x1="140" y1="85" x2="208" y2="60" stroke="#6c5ce7" stroke-width="1.2" opacity="0.5"/>
              <!-- Labels -->
              <text x="40" y="115" text-anchor="middle" font-size="8" fill="#9b95b0" font-family="Inter, Arial, sans-serif">Input</text>
              <text x="130" y="110" text-anchor="middle" font-size="8" fill="#9b95b0" font-family="Inter, Arial, sans-serif">Hidden</text>
              <text x="220" y="85" text-anchor="middle" font-size="8" fill="#9b95b0" font-family="Inter, Arial, sans-serif">Output</text>
              <!-- Sigma symbol -->
              <text x="130" y="40" text-anchor="middle" font-size="11" fill="#6c5ce7" font-family="Inter, Arial, sans-serif" font-weight="600">Σ</text>
              <text x="130" y="90" text-anchor="middle" font-size="11" fill="#6c5ce7" font-family="Inter, Arial, sans-serif" font-weight="600">Σ</text>
            </svg>