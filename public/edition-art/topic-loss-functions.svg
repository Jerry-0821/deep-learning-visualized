<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Grid -->
              <g opacity="0.15">
                <line x1="60" y1="20" x2="60" y2="140" stroke="#6c5ce7" stroke-width="0.5"/>
                <line x1="110" y1="20" x2="110" y2="140" stroke="#6c5ce7" stroke-width="0.5"/>
                <line x1="160" y1="20" x2="160" y2="140" stroke="#6c5ce7" stroke-width="0.5"/>
                <line x1="210" y1="20" x2="210" y2="140" stroke="#6c5ce7" stroke-width="0.5"/>
                <line x1="260" y1="20" x2="260" y2="140" stroke="#6c5ce7" stroke-width="0.5"/>
                <line x1="40" y1="40" x2="280" y2="40" stroke="#6c5ce7" stroke-width="0.5"/>
                <line x1="40" y1="70" x2="280" y2="70" stroke="#6c5ce7" stroke-width="0.5"/>
                <line x1="40" y1="100" x2="280" y2="100" stroke="#6c5ce7" stroke-width="0.5"/>
                <line x1="40" y1="130" x2="280" y2="130" stroke="#6c5ce7" stroke-width="0.5"/>
              </g>
              <!-- Loss landscape bowl -->
              <path d="M50,38 C70,36 100,55 130,80 C145,95 155,118 160,125 C165,118 175,95 190,80 C220,55 250,36 270,38" stroke="#6c5ce7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <!-- Bowl fill -->
              <path d="M50,38 C70,36 100,55 130,80 C145,95 155,118 160,125 C165,118 175,95 190,80 C220,55 250,36 270,38 L270,140 L50,140 Z" fill="rgba(136,125,240,0.05)"/>
              <!-- Current position dot -->
              <circle cx="105" cy="60" r="6" fill="#6c5ce7" opacity="0.9"/>
              <circle cx="105" cy="60" r="10" fill="none" stroke="#6c5ce7" stroke-width="1" opacity="0.3">
                <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
              </circle>
              <!-- Arrow toward minimum -->
              <path d="M112,65 Q135,95 155,120" stroke="#a29bfe" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-loss)"/>
              <!-- Minimum marker -->
              <circle cx="160" cy="125" r="4" fill="#a29bfe"/>
              <text x="160" y="145" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="600">minimum</text>
              <text x="105" y="48" text-anchor="middle" fill="#6c5ce7" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="600">current</text>
              <!-- Labels -->
              <text x="30" y="85" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500" transform="rotate(-90 30 85)">Loss</text>
              <text x="160" y="15" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">Parameters</text>
              <defs><marker id="arrow-loss" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#a29bfe"/></marker></defs>
            </svg>