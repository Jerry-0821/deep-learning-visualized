<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Unrolled RNN cells -->
              <g>
                <!-- Cell 1 -->
                <rect x="30" y="50" width="50" height="40" rx="8" fill="rgba(0,184,148,0.08)" stroke="#00b894" stroke-width="1.5"/>
                <text x="55" y="74" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">h₁</text>
                <!-- Input -->
                <line x1="55" y1="110" x2="55" y2="92" stroke="#00b894" stroke-width="1.5" marker-end="url(#arrow-rnn)"/>
                <text x="55" y="122" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">x₁</text>
                <!-- Output -->
                <line x1="55" y1="50" x2="55" y2="30" stroke="#00b894" stroke-width="1.5" marker-end="url(#arrow-rnn)"/>
                <text x="55" y="24" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">y₁</text>

                <!-- Cell 2 -->
                <rect x="100" y="50" width="50" height="40" rx="8" fill="rgba(0,184,148,0.08)" stroke="#00b894" stroke-width="1.5"/>
                <text x="125" y="74" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">h₂</text>
                <line x1="125" y1="110" x2="125" y2="92" stroke="#00b894" stroke-width="1.5" marker-end="url(#arrow-rnn)"/>
                <text x="125" y="122" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">x₂</text>
                <line x1="125" y1="50" x2="125" y2="30" stroke="#00b894" stroke-width="1.5" marker-end="url(#arrow-rnn)"/>
                <text x="125" y="24" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">y₂</text>
                <!-- h connection -->
                <line x1="80" y1="70" x2="100" y2="70" stroke="#00b894" stroke-width="2" marker-end="url(#arrow-rnn)"/>

                <!-- Cell 3 -->
                <rect x="170" y="50" width="50" height="40" rx="8" fill="rgba(0,184,148,0.08)" stroke="#00b894" stroke-width="1.5"/>
                <text x="195" y="74" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">h₃</text>
                <line x1="195" y1="110" x2="195" y2="92" stroke="#00b894" stroke-width="1.5" marker-end="url(#arrow-rnn)"/>
                <text x="195" y="122" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">x₃</text>
                <line x1="195" y1="50" x2="195" y2="30" stroke="#00b894" stroke-width="1.5" marker-end="url(#arrow-rnn)"/>
                <text x="195" y="24" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">y₃</text>
                <line x1="150" y1="70" x2="170" y2="70" stroke="#00b894" stroke-width="2" marker-end="url(#arrow-rnn)"/>

                <!-- Cell 4 -->
                <rect x="240" y="50" width="50" height="40" rx="8" fill="rgba(0,184,148,0.08)" stroke="#00b894" stroke-width="1.5"/>
                <text x="265" y="74" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">h₄</text>
                <line x1="265" y1="110" x2="265" y2="92" stroke="#00b894" stroke-width="1.5" marker-end="url(#arrow-rnn)"/>
                <text x="265" y="122" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">x₄</text>
                <line x1="265" y1="50" x2="265" y2="30" stroke="#00b894" stroke-width="1.5" marker-end="url(#arrow-rnn)"/>
                <text x="265" y="24" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">y₄</text>
                <line x1="220" y1="70" x2="240" y2="70" stroke="#00b894" stroke-width="2" marker-end="url(#arrow-rnn)"/>
              </g>
              <!-- Temporal flow label -->
              <text x="160" y="148" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">Temporal flow →</text>
              <defs><marker id="arrow-rnn" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#00b894"/></marker></defs>
            </svg>