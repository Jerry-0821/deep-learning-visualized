<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Image icon -->
              <g transform="translate(25,30)">
                <rect x="0" y="0" width="70" height="70" rx="8" fill="rgba(0,184,148,0.06)" stroke="#00b894" stroke-width="1.5"/>
                <!-- Mountain scenery icon -->
                <path d="M10,55 L25,30 L40,50 L48,38 L60,55" stroke="#00b894" stroke-width="1.5" fill="rgba(0,184,148,0.08)" stroke-linejoin="round"/>
                <circle cx="50" cy="22" r="6" fill="rgba(0,184,148,0.15)" stroke="#00b894" stroke-width="1"/>
                <text x="35" y="90" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">Input</text>
              </g>
              <!-- Arrow -->
              <path d="M110,65 L135,65" stroke="#00b894" stroke-width="2" marker-end="url(#arrow-feat)"/>
              <!-- Feature maps (stacked) -->
              <g transform="translate(150,15)">
                <!-- Map 3 (back) — dots pattern -->
                <rect x="24" y="0" width="60" height="60" rx="5" fill="rgba(0,184,148,0.04)" stroke="rgba(0,184,148,0.2)" stroke-width="1"/>
                <circle cx="38" cy="14" r="2" fill="#00b894" opacity="0.3"/>
                <circle cx="52" cy="22" r="2" fill="#00b894" opacity="0.3"/>
                <circle cx="68" cy="30" r="2" fill="#00b894" opacity="0.3"/>
                <circle cx="45" cy="40" r="2" fill="#00b894" opacity="0.3"/>
                <circle cx="60" cy="48" r="2" fill="#00b894" opacity="0.3"/>
                <!-- Map 2 (mid) — diagonal lines -->
                <rect x="12" y="20" width="60" height="60" rx="5" fill="rgba(0,184,148,0.05)" stroke="rgba(0,184,148,0.25)" stroke-width="1"/>
                <line x1="22" y1="30" x2="42" y2="50" stroke="#00b894" stroke-width="1" opacity="0.4"/>
                <line x1="32" y1="28" x2="52" y2="48" stroke="#00b894" stroke-width="1" opacity="0.4"/>
                <line x1="42" y1="26" x2="62" y2="46" stroke="#00b894" stroke-width="1" opacity="0.4"/>
                <line x1="52" y1="36" x2="65" y2="55" stroke="#00b894" stroke-width="1" opacity="0.4"/>
                <!-- Map 1 (front) — horizontal edges -->
                <rect x="0" y="40" width="60" height="60" rx="5" fill="rgba(0,184,148,0.06)" stroke="#00b894" stroke-width="1.5"/>
                <line x1="8" y1="55" x2="52" y2="55" stroke="#00b894" stroke-width="1.5" opacity="0.5"/>
                <line x1="8" y1="65" x2="52" y2="65" stroke="#00b894" stroke-width="1.5" opacity="0.4"/>
                <line x1="8" y1="75" x2="52" y2="75" stroke="#00b894" stroke-width="1.5" opacity="0.3"/>
                <line x1="8" y1="85" x2="52" y2="85" stroke="#00b894" stroke-width="1.5" opacity="0.2"/>
              </g>
              <!-- Labels -->
              <text x="175" y="128" text-anchor="middle" fill="#00b894" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="600">Edges</text>
              <text x="195" y="15" text-anchor="middle" fill="#00b894" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="600">Textures</text>
              <text x="215" y="75" text-anchor="middle" fill="#00b894" font-size="7" font-family="Inter, Arial, sans-serif" font-weight="500" opacity="0.6">Patterns</text>
              <text x="210" y="148" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">Feature Maps</text>
              <defs><marker id="arrow-feat" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#00b894"/></marker></defs>
            </svg>