<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- ReLU -->
              <g transform="translate(10,15)">
                <rect x="0" y="0" width="68" height="55" rx="6" fill="rgba(136,125,240,0.04)" stroke="rgba(136,125,240,0.12)" stroke-width="1"/>
                <line x1="10" y1="45" x2="58" y2="45" stroke="#ddd" stroke-width="0.5"/>
                <line x1="34" y1="8" x2="34" y2="50" stroke="#ddd" stroke-width="0.5"/>
                <polyline points="12,45 34,45 56,12" stroke="#6c5ce7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <text x="34" y="65" text-anchor="middle" fill="#5c5677" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="600">ReLU</text>
              </g>
              <!-- Sigmoid -->
              <g transform="translate(85,15)">
