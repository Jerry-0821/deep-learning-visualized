<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Input grid 5x5 -->
              <g transform="translate(30,20)">
                <rect x="0" y="0" width="100" height="100" rx="4" fill="rgba(0,184,148,0.03)" stroke="rgba(0,184,148,0.15)" stroke-width="1"/>
                <!-- Grid lines -->
                <line x1="20" y1="0" x2="20" y2="100" stroke="rgba(0,184,148,0.1)" stroke-width="0.5"/>
                <line x1="40" y1="0" x2="40" y2="100" stroke="rgba(0,184,148,0.1)" stroke-width="0.5"/>
                <line x1="60" y1="0" x2="60" y2="100" stroke="rgba(0,184,148,0.1)" stroke-width="0.5"/>
                <line x1="80" y1="0" x2="80" y2="100" stroke="rgba(0,184,148,0.1)" stroke-width="0.5"/>
                <line x1="0" y1="20" x2="100" y2="20" stroke="rgba(0,184,148,0.1)" stroke-width="0.5"/>
                <line x1="0" y1="40" x2="100" y2="40" stroke="rgba(0,184,148,0.1)" stroke-width="0.5"/>
                <line x1="0" y1="60" x2="100" y2="60" stroke="rgba(0,184,148,0.1)" stroke-width="0.5"/>
                <line x1="0" y1="80" x2="100" y2="80" stroke="rgba(0,184,148,0.1)" stroke-width="0.5"/>
                <!-- Filter highlight 3x3 -->
                <rect x="20" y="20" width="60" height="60" rx="2" fill="rgba(0,184,148,0.12)" stroke="#00b894" stroke-width="2" stroke-dasharray="4 2"/>
                <!-- Filter values -->
                <text x="36" y="40" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">1</text>
                <text x="50" y="40" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">0</text>
                <text x="66" y="40" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">−1</text>
                <text x="36" y="56" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">1</text>
                <text x="50" y="56" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">0</text>
                <text x="66" y="56" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">−1</text>
                <text x="36" y="72" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">1</text>
                <text x="50" y="72" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">0</text>
                <text x="66" y="72" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="600">−1</text>
              </g>
              <text x="80" y="138" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">5×5 Input</text>
              <!-- Arrow -->
              <path d="M145,70 L175,70" stroke="#00b894" stroke-width="2" marker-end="url(#arrow-conv)"/>
              <text x="160" y="62" text-anchor="middle" fill="#00b894" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="600">×</text>
              <!-- Output grid 3x3 -->
              <g transform="translate(190,32)">
                <rect x="0" y="0" width="72" height="72" rx="4" fill="rgba(0,184,148,0.06)" stroke="#00b894" stroke-width="1.5"/>
                <line x1="24" y1="0" x2="24" y2="72" stroke="rgba(0,184,148,0.15)" stroke-width="0.5"/>
                <line x1="48" y1="0" x2="48" y2="72" stroke="rgba(0,184,148,0.15)" stroke-width="0.5"/>
                <line x1="0" y1="24" x2="72" y2="24" stroke="rgba(0,184,148,0.15)" stroke-width="0.5"/>
                <line x1="0" y1="48" x2="72" y2="48" stroke="rgba(0,184,148,0.15)" stroke-width="0.5"/>
                <!-- Highlight one cell -->
                <rect x="0" y="0" width="24" height="24" fill="rgba(0,184,148,0.15)" stroke="#00b894" stroke-width="1.5"/>
                <text x="12" y="16" text-anchor="middle" fill="#00b894" font-size="9" font-family="Inter, Arial, sans-serif" font-weight="700">3</text>
              </g>
              <text x="226" y="122" text-anchor="middle" fill="#9b95b0" font-size="8" font-family="Inter, Arial, sans-serif" font-weight="500">3×3 Feature map</text>
              <defs><marker id="arrow-conv" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#00b894"/></marker></defs>
            </svg>